name: Claude Assistant

# Tag @claude in any issue or PR comment to have Claude respond, fix, or implement.
# Setup: run /install-github-app inside Claude Code, or add ANTHROPIC_API_KEY
# (or CLAUDE_CODE_OAUTH_TOKEN for Pro/Max) to repo secrets. See SETUP.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only respond to humans, never to bots (prevents loops with the review workflow)
    if: |
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Or for Claude Pro/Max subscribers instead of an API key:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 15
